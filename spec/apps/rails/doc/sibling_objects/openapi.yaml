---
openapi: 3.1.0
info:
  title: Sibling objects
  version: 1.0.0
servers: []
paths:
  "/sibling_objects/dictionary":
    get:
      summary: GET /sibling_objects/dictionary
      tags: []
      responses:
        '200':
          description: keeps a oneOf dictionary schema on every sibling
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        meta:
                          type: object
                          additionalProperties:
                            oneOf:
                            - type: string
                            - type: integer
                      required:
                      - meta
                required:
                - products
              example:
                products:
                - meta:
                    id: 1
                    a: 1
                - meta:
                    id: 2
                    b: x
  "/sibling_objects/empty_override":
    get:
      summary: GET /sibling_objects/empty_override
      tags: []
      responses:
        '200':
          description: ignores an empty additionalProperties override
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        meta:
                          type: object
                          properties:
                            id:
                              type: integer
                            a:
                              type:
                              - integer
                              - 'null'
                            b:
                              type:
                              - string
                              - 'null'
                          required:
                          - id
                      required:
                      - meta
                required:
                - products
              example:
                products:
                - meta:
                    id: 1
                    a: 1
                - meta:
                    id: 2
                    b: x
  "/sibling_objects/hybrid":
    get:
      summary: GET /sibling_objects/hybrid
      tags: []
      responses:
        '200':
          description: keeps the shared required keys of a hybrid object
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        meta:
                          type: object
                          properties:
                            id:
                              type: integer
                            a:
                              type:
                              - integer
                              - 'null'
                            b:
                              type:
                              - string
                              - 'null'
                          required:
                          - id
                          additionalProperties:
                            type: string
                      required:
                      - meta
                required:
                - products
              example:
                products:
                - meta:
                    id: 1
                    a: 1
                - meta:
                    id: 2
                    b: x
  "/sibling_objects/settings":
    get:
      summary: GET /sibling_objects/settings
      tags: []
      responses:
        '200':
          description: records flag options
          content:
            application/json:
              schema:
                type: object
                properties:
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        default:
                          oneOf:
                          - type: boolean
                          - type: 'null'
                          - type: string
                        enum:
                          oneOf:
                          - type: boolean
                          - type: 'null'
                          - type: string
                      required:
                      - default
                      - enum
                required:
                - options
              example:
                options:
                - default: true
                  enum: true
      parameters:
      - name: flags
        in: query
        required: false
        schema:
          type: integer
        example: 1
