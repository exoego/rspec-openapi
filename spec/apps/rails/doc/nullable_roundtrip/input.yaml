---
openapi: 3.2.0
info:
  title: Nullable round-trip
  version: 1.0.0
servers: []
paths:
  "/nullable_roundtrip":
    get:
      summary: placeholder overwritten by the recording
      responses:
        '200':
          description: old description
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        # Hand-written response the recording never touches. Response codes are
        # never cleaned up, so this schema survives the run: reading normalizes
        # the JSON-Schema null form to the internal `nullable` shape, and
        # writing converts it back. A broken conversion rewrites it as the
        # invalid nested [[string, integer], "null"] (#451).
        '409':
          description: hand-written multi-type nullable schema
          content:
            application/json:
              schema:
                type:
                - string
                - integer
                - 'null'
        '410':
          description: hand-written null variant beside an enum
          headers:
            x-mode:
              schema:
                type:
                - string
                - 'null'
                enum:
                - a
          content:
            application/json:
              schema:
                oneOf:
                - type:
                  - string
                  - 'null'
                  enum:
                  - a
                - type: 'null'
                  description: Cleared
        '412':
          description: hand-written allOf
          content:
            application/json:
              schema:
                allOf:
                - type:
                  - string
                  - 'null'
                  enum:
                  - a
        '422':
          description: component named like a keyword
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/enum"
        default:
          description: response named like a keyword
          content:
            application/json:
              schema:
                type:
                - string
                - 'null'
                enum:
                - a
      x-options:
        nullable: true
        enum:
        - a
components:
  schemas:
    enum:
      type:
      - string
      - 'null'
      enum:
      - a
