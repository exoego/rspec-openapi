info:
  title: Nullable round-trip
  version: 1.0.0
servers: []
paths:
  "/nullable_roundtrip":
    get:
      summary: placeholder overwritten by the recording
      responses:
        '200':
          description: old description
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        # Hand-written response the recording never touches. Response codes are
        # never cleaned up, so this schema survives the run: reading normalizes
        # the JSON-Schema null form to the internal `nullable` shape, and
        # writing converts it back. A broken conversion rewrites it as the
        # invalid nested [[string, integer], "null"] (#451).
        '409':
          description: hand-written multi-type nullable schema
          content:
            application/json:
              schema:
                type:
                - string
                - integer
                - 'null'
