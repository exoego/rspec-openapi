    get:
      summary: GET /keyword_fields/required
      tags: []
      responses:
        '200':
          description: returns a body with properties and required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  properties:
                    type: object
                    properties:
                      a:
                        type: integer
                    required:
                    - a
                  required:
                    type: array
                    items: {}
                  meta:
                    type: object
                    properties: {}
                required:
                - properties
                - required
                - meta
              examples:
                returns_a_body_with_properties_and_required_fields:
                  summary: returns a body with properties and required fields
                  value:
                    properties:
                      a: 1
                    required: []
                    meta: {}
  "/keyword_fields/security":
    get:
      summary: GET /keyword_fields/security
      tags: []
      security:
      - SecretApiKeyAuth: []
      responses:
        '200':
          description: returns a body with security and parameters fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  security:
                    type: string
                  parameters:
                    type: array
                    items: {}
                required:
                - security
                - parameters
              example:
                security: guest
                parameters: []
