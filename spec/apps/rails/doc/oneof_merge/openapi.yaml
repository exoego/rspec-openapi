---
openapi: 3.1.0
info:
  title: oneOf merge
  version: 1.0.0
servers: []
paths:
  "/oneof_merge/annotated":
    get:
      summary: GET /oneof_merge/annotated
      responses:
        '200':
          description: records an integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    oneOf:
                    - type: integer
                    - type: string
                    description: The display name
                    deprecated: true
                required:
                - value
              example:
                value: 1
      tags: []
  "/oneof_merge/arrays_then_string":
    get:
      summary: GET /oneof_merge/arrays_then_string
      tags: []
      responses:
        '200':
          description: records the string
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    oneOf:
                    - type: array
                      items:
                        type: integer
                    - type: string
                required:
                - tags
              example:
                tags: a
  "/oneof_merge/boolean_then_objects":
    get:
      summary: GET /oneof_merge/boolean_then_objects
      tags: []
      responses:
        '200':
          description: records the second object
          content:
            application/json:
              schema:
                type: object
                properties:
                  flag:
                    oneOf:
                    - type: boolean
                    - type: object
                      properties:
                        a:
                          type: integer
                        b:
                          type: string
                required:
                - flag
              example:
                flag:
                  a: 1
                  b: x
  "/oneof_merge/empty_one_of":
    get:
      summary: GET /oneof_merge/empty_one_of
      responses:
        '200':
          description: records an integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    oneOf:
                    - type: integer
                    - type: string
                required:
                - value
              example:
                value: 1
      tags: []
  "/oneof_merge/integer_then_number":
    get:
      summary: GET /oneof_merge/integer_then_number
      tags: []
      responses:
        '200':
          description: records a number
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: number
                    format: float
                required:
                - value
              example:
                value: 1.5
  "/oneof_merge/mixed_numbers":
    get:
      summary: GET /oneof_merge/mixed_numbers
      tags: []
      responses:
        '200':
          description: records both
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      type: number
                      format: float
                required:
                - values
              example:
                values:
                - 1
                - 1.5
  "/oneof_merge/number_then_integer":
    get:
      summary: GET /oneof_merge/number_then_integer
      tags: []
      responses:
        '200':
          description: records an integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: number
                    format: float
                required:
                - value
              example:
                value: 1
  "/oneof_merge/numbers_then_string":
    get:
      summary: GET /oneof_merge/numbers_then_string
      tags: []
      responses:
        '200':
          description: records a string
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    oneOf:
                    - type: number
                      format: float
                    - type: string
                required:
                - value
              example:
                value: a
  "/oneof_merge/objects_then_boolean":
    get:
      summary: GET /oneof_merge/objects_then_boolean
      tags: []
      responses:
        '200':
          description: records the boolean
          content:
            application/json:
              schema:
                type: object
                properties:
                  flag:
                    oneOf:
                    - type: boolean
                    - type: object
                      properties:
                        a:
                          type: integer
                        b:
                          type: string
                required:
                - flag
              example:
                flag: true
  "/oneof_merge/param":
    get:
      summary: GET /oneof_merge/param
      parameters:
      - name: q
        in: query
        required: false
        schema:
          oneOf:
          - type: integer
          - type: 'null'
          - type: string
        example: foo
      responses:
        '200':
          description: records a string
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                - ok
              example:
                ok: true
      tags: []
  "/oneof_merge/param_from_scratch":
    get:
      summary: GET /oneof_merge/param_from_scratch
      tags: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          oneOf:
          - type: integer
          - type: 'null'
          - type: string
        example: 1
      responses:
        '200':
          description: records an integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                - ok
              example:
                ok: true
  "/oneof_merge/schema_field":
    get:
      summary: GET /oneof_merge/schema_field
      tags: []
      responses:
        '200':
          description: records the second body
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  schema:
                    type: object
                    properties:
                      type:
                        type: string
                    required:
                    - type
                  required:
                    type: array
                    items:
                      type: string
                required:
                - id
                - schema
                - required
              example:
                id: 2
                schema:
                  type: integer
                required:
                - name
  "/oneof_merge/tags_integers_then_mixed":
    get:
      summary: GET /oneof_merge/tags_integers_then_mixed
      tags: []
      responses:
        '200':
          description: records both types
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      oneOf:
                      - type: integer
                      - type: string
                required:
                - tags
              example:
                tags:
                - a
                - 1
  "/oneof_merge/tags_mixed_then_integers":
    get:
      summary: GET /oneof_merge/tags_mixed_then_integers
      tags: []
      responses:
        '200':
          description: records integers
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      oneOf:
                      - type: integer
                      - type: string
                required:
                - tags
              example:
                tags:
                - 1
  "/oneof_merge/typed_one_of":
    get:
      summary: GET /oneof_merge/typed_one_of
      responses:
        '200':
          description: records the 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                - ok
              example:
                ok: true
        '409':
          description: written by hand, a type beside the oneOf
          content:
            application/json:
              schema:
                type:
                - object
                - 'null'
                oneOf:
                - required:
                  - meow
                - required:
                  - bark
      tags: []
  "/oneof_merge/typeless":
    get:
      summary: GET /oneof_merge/typeless
      responses:
        '200':
          description: records items of two types
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      oneOf:
                      - type: integer
                      - type: 'null'
                      - type: string
                      description: Set once the user picks one
                required:
                - values
              example:
                values:
                - 1
                - x
      tags: []
  "/oneof_merge/typeless_enum":
    get:
      summary: GET /oneof_merge/typeless_enum
      responses:
        '200':
          description: records items of two types
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      oneOf:
                      - type: integer
                      - type: 'null'
                      - type: string
                      enum:
                      - 1
                      - x
                required:
                - values
              example:
                values:
                - 1
                - x
      tags: []
