---
openapi: 3.1.0
info:
  title: oneOf merge
  version: 1.0.0
servers: []
paths:
  "/oneof_merge/annotated":
    get:
      summary: GET /oneof_merge/annotated
      responses:
        '200':
          description: records integer on annotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    oneOf:
                    - type: integer
                    - type: string
                    description: The display name
                    deprecated: true
                required:
                - value
              example:
                value: 1
      tags: []
  "/oneof_merge/arrays_then_string":
    get:
      summary: GET /oneof_merge/arrays_then_string
      tags: []
      responses:
        '200':
          description: records string on arrays_then_string
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    oneOf:
                    - type: array
                      items:
                        type: integer
                    - type: string
                required:
                - tags
              example:
                tags: a
  "/oneof_merge/boolean_then_objects":
    get:
      summary: GET /oneof_merge/boolean_then_objects
      tags: []
      responses:
        '200':
          description: records object_b on boolean_then_objects
          content:
            application/json:
              schema:
                type: object
                properties:
                  flag:
                    oneOf:
                    - type: boolean
                    - type: object
                      properties:
                        a:
                          type: integer
                        b:
                          type: string
                required:
                - flag
              example:
                flag:
                  a: 1
                  b: x
  "/oneof_merge/empty_one_of":
    get:
      summary: GET /oneof_merge/empty_one_of
      responses:
        '200':
          description: records integer on empty_one_of
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    oneOf:
                    - type: integer
                    - type: string
                required:
                - value
              example:
                value: 1
      tags: []
  "/oneof_merge/enum_empty":
    get:
      summary: GET /oneof_merge/enum_empty
      tags: []
      responses:
        '200':
          description: records a string
          content:
            application/json:
              schema:
                type: object
                properties:
                  s:
                    type: string
                required:
                - s
              example:
                s: a
  "/oneof_merge/enum_mixed_items":
    get:
      summary: GET /oneof_merge/enum_mixed_items
      tags: []
      responses:
        '200':
          description: records nil beside other types
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        p:
                          type: array
                          items:
                            oneOf:
                            - type: boolean
                              enum:
                              - a
                              - b
                              - true
                            - type: 'null'
                            - type: string
                              enum:
                              - a
                              - b
                              - true
                      required:
                      - p
                required:
                - nodes
              example:
                nodes:
                - p:
                  -
                  - a
                - p:
                  - b
                  - true
  "/oneof_merge/enum_nil_first":
    get:
      summary: GET /oneof_merge/enum_nil_first
      tags: []
      responses:
        '200':
          description: records nil in the first sibling
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        p:
                          type: array
                          items:
                            type:
                            - string
                            - 'null'
                            enum:
                            - a
                            - b
                            - true
                            -
                      required:
                      - p
                required:
                - nodes
              example:
                nodes:
                - p:
                  -
                - p:
                  - a
  "/oneof_merge/enum_null_later":
    get:
      summary: GET /oneof_merge/enum_null_later
      tags: []
      responses:
        '200':
          description: records null
          content:
            application/json:
              schema:
                type: object
                properties:
                  s:
                    type:
                    - string
                    - 'null'
                    enum:
                    - a
                    - b
                    -
                required:
                - s
              example:
                s:
  "/oneof_merge/enum_null_only":
    get:
      summary: GET /oneof_merge/enum_null_only
      tags: []
      responses:
        '200':
          description: records null
          content:
            application/json:
              schema:
                type: object
                properties:
                  s:
                    enum:
                    - a
                    - b
                    -
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        s:
                          enum:
                          - a
                          - b
                          -
                      required:
                      - s
                required:
                - s
                - nodes
              example:
                s:
                nodes:
                - s:
                - s:
  "/oneof_merge/enum_sort":
    get:
      summary: GET /oneof_merge/enum_sort
      tags: []
      parameters:
      - name: sort
        in: query
        required: false
        schema:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - name
            - "-name"
        example:
        - name
        - "-name"
      responses:
        '200':
          description: records it twice
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                - ok
              example:
                ok: true
  "/oneof_merge/enum_tags":
    get:
      summary: GET /oneof_merge/enum_tags
      tags: []
      responses:
        '200':
          description: records null
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type:
                    - array
                    - 'null'
                    items:
                      type: string
                      enum:
                      - new
                      - sale
                required:
                - tags
              example:
                tags:
  "/oneof_merge/flag_boolean":
    get:
      summary: GET /oneof_merge/flag_boolean
      responses:
        '200':
          description: records boolean on flag_boolean
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FlagSetting"
              example:
                value: true
      tags: []
  "/oneof_merge/flag_object":
    get:
      summary: GET /oneof_merge/flag_object
      responses:
        '200':
          description: records object on flag_object
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FlagSetting"
              example:
                value:
                  x: '1'
      tags: []
  "/oneof_merge/format_null":
    get:
      summary: GET /oneof_merge/format_null
      tags: []
      responses:
        '200':
          description: records null
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  reminders_at:
                    type:
                    - array
                    - 'null'
                    items:
                      type: string
                      format: date-time
                required:
                - deleted_at
                - reminders_at
              example:
                deleted_at:
                reminders_at:
  "/oneof_merge/integer_then_number":
    get:
      summary: GET /oneof_merge/integer_then_number
      tags: []
      responses:
        '200':
          description: records float on integer_then_number
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: number
                    format: float
                required:
                - value
              example:
                value: 1.5
  "/oneof_merge/mixed_numbers":
    get:
      summary: GET /oneof_merge/mixed_numbers
      tags: []
      responses:
        '200':
          description: records mixed on mixed_numbers
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      type: number
                      format: float
                required:
                - values
              example:
                values:
                - 1
                - 1.5
  "/oneof_merge/null_items":
    get:
      summary: GET /oneof_merge/null_items
      tags: []
      responses:
        '200':
          description: records mixed on null_items
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: 'null'
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        a:
                          type: array
                          items:
                            type:
                            - string
                            - 'null'
                      required:
                      - a
                required:
                - tags
                - nodes
              example:
                tags:
                -
                -
                nodes:
                - a:
                  -
                  -
                - a:
                  - x
  "/oneof_merge/null_variants":
    get:
      summary: GET /oneof_merge/null_variants
      responses:
        '200':
          description: records filled on null_variants
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    oneOf:
                    - description: Cleared by the user
                      type: 'null'
                    - type: string
                  other:
                    oneOf:
                    - type:
                      - string
                      - 'null'
                    - type: integer
                required:
                - value
                - other
              example:
                value: a
                other: 1
      tags: []
  "/oneof_merge/nullable_siblings":
    get:
      summary: GET /oneof_merge/nullable_siblings
      tags: []
      responses:
        '200':
          description: records mixed on nullable_siblings
          content:
            application/json:
              schema:
                type: object
                properties:
                  strings:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: array
                          items:
                            type:
                            - string
                            - 'null'
                      required:
                      - path
                  numbers:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: array
                          items:
                            type:
                            - number
                            - 'null'
                            format: float
                      required:
                      - path
                required:
                - strings
                - numbers
              example:
                strings:
                - path:
                  - a
                - path:
                  - b
                  -
                numbers:
                - path:
                  - 1
                  -
                - path:
                  - 2.5
  "/oneof_merge/number_then_integer":
    get:
      summary: GET /oneof_merge/number_then_integer
      tags: []
      responses:
        '200':
          description: records integer on number_then_integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: number
                    format: float
                required:
                - value
              example:
                value: 1
  "/oneof_merge/numbers_then_string":
    get:
      summary: GET /oneof_merge/numbers_then_string
      tags: []
      responses:
        '200':
          description: records string on numbers_then_string
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    oneOf:
                    - type: number
                      format: float
                    - type: string
                required:
                - value
              example:
                value: a
  "/oneof_merge/objects_then_boolean":
    get:
      summary: GET /oneof_merge/objects_then_boolean
      tags: []
      responses:
        '200':
          description: records boolean on objects_then_boolean
          content:
            application/json:
              schema:
                type: object
                properties:
                  flag:
                    oneOf:
                    - type: boolean
                    - type: object
                      properties:
                        a:
                          type: integer
                        b:
                          type: string
                required:
                - flag
              example:
                flag: true
  "/oneof_merge/overlapping_arrays":
    get:
      summary: GET /oneof_merge/overlapping_arrays
      tags: []
      responses:
        '200':
          description: records mixed on overlapping_arrays
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      oneOf:
                      - type: array
                        items:
                          type: number
                          format: float
                      - type: boolean
                required:
                - values
              example:
                values:
                - - 1
                - - 2.5
                - true
  "/oneof_merge/param":
    get:
      summary: GET /oneof_merge/param
      parameters:
      - name: q
        in: query
        required: false
        schema:
          oneOf:
          - type: integer
          - type: 'null'
          - type: string
        example: foo
      responses:
        '200':
          description: records a string for a hand-written query parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                - ok
              example:
                ok: true
      tags: []
  "/oneof_merge/param_from_scratch":
    get:
      summary: GET /oneof_merge/param_from_scratch
      tags: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          oneOf:
          - type: integer
          - type: 'null'
          - type: string
        example: 1
      responses:
        '200':
          description: records an integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                - ok
              example:
                ok: true
  "/oneof_merge/path_segments":
    get:
      summary: GET /oneof_merge/path_segments
      responses:
        '200':
          description: records mixed on path_segments
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: array
                          items:
                            "$ref": "#/components/schemas/PathSegment"
                      required:
                      - path
                required:
                - nodes
              example:
                nodes:
                - path:
                  - user
                  - details
                - path:
                  - billing
                  - true
      tags: []
  "/oneof_merge/pref_boolean":
    get:
      summary: GET /oneof_merge/pref_boolean
      responses:
        '200':
          description: records boolean on pref_boolean
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PrefSetting"
              example:
                value: true
      tags: []
  "/oneof_merge/pref_object":
    get:
      summary: GET /oneof_merge/pref_object
      responses:
        '200':
          description: records object on pref_object
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PrefSetting"
              example:
                value:
                  x: '1'
      tags: []
  "/oneof_merge/pruned":
    get:
      summary: GET /oneof_merge/pruned
      responses:
        '200':
          description: records object on pruned
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    type: integer
                - type: object
                  properties:
                    a:
                      type: integer
                  required:
                  - a
              example:
                a: 1
      tags: []
  "/oneof_merge/schema_field":
    get:
      summary: GET /oneof_merge/schema_field
      tags: []
      responses:
        '200':
          description: records integer on schema_field
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  schema:
                    type: object
                    properties:
                      type:
                        type: string
                    required:
                    - type
                  required:
                    type: array
                    items:
                      type: string
                required:
                - id
                - schema
                - required
              example:
                id: 2
                schema:
                  type: integer
                required:
                - name
  "/oneof_merge/tagged":
    get:
      summary: GET /oneof_merge/tagged
      responses:
        '200':
          description: records object on tagged
          content:
            application/json:
              schema:
                oneOf:
                - type: boolean
                - type: object
                  properties:
                    tag:
                      "$ref": "#/components/schemas/Tag"
                  required:
                  - tag
              example:
                tag:
                  name: x
      tags: []
  "/oneof_merge/tags_integers_then_mixed":
    get:
      summary: GET /oneof_merge/tags_integers_then_mixed
      tags: []
      responses:
        '200':
          description: records mixed on tags_integers_then_mixed
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      oneOf:
                      - type: integer
                      - type: string
                required:
                - tags
              example:
                tags:
                - a
                - 1
  "/oneof_merge/tags_mixed_then_integers":
    get:
      summary: GET /oneof_merge/tags_mixed_then_integers
      tags: []
      responses:
        '200':
          description: records integers on tags_mixed_then_integers
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      oneOf:
                      - type: integer
                      - type: string
                required:
                - tags
              example:
                tags:
                - 1
  "/oneof_merge/typed_one_of":
    get:
      summary: GET /oneof_merge/typed_one_of
      responses:
        '200':
          description: records ok on typed_one_of
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                - ok
              example:
                ok: true
        '409':
          description: written by hand, a type beside the oneOf
          content:
            application/json:
              schema:
                type:
                - object
                - 'null'
                oneOf:
                - required:
                  - meow
                - required:
                  - bark
        '422':
          description: written by hand, a null variant beside a type that allows null
          content:
            application/json:
              schema:
                type:
                - object
                - 'null'
                oneOf:
                - type: object
                  required:
                  - meow
                - type: 'null'
      tags: []
  "/oneof_merge/typeless":
    get:
      summary: GET /oneof_merge/typeless
      responses:
        '200':
          description: records mixed on typeless
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      oneOf:
                      - type: integer
                      - type: 'null'
                      - type: string
                      description: Set once the user picks one
                required:
                - values
              example:
                values:
                - 1
                - x
      tags: []
  "/oneof_merge/typeless_enum":
    get:
      summary: GET /oneof_merge/typeless_enum
      responses:
        '200':
          description: records mixed on typeless_enum
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      oneOf:
                      - type: integer
                      - type: 'null'
                      - type: string
                      enum:
                      - 1
                      - x
                      -
                required:
                - values
              example:
                values:
                - 1
                - x
      tags: []
  "/oneof_merge/untagged":
    get:
      summary: GET /oneof_merge/untagged
      responses:
        '200':
          description: records boolean on untagged
          content:
            application/json:
              schema:
                oneOf:
                - type: boolean
                - type: object
                  properties:
                    tag:
                      "$ref": "#/components/schemas/Tag"
                  required:
                  - tag
              example: true
      tags: []
components:
  schemas:
    FlagSetting:
      type: object
      properties:
        value:
          oneOf:
          - type: boolean
          - type: object
            properties:
              x:
                type: string
            required:
            - x
      required:
      - value
    PathSegment:
      oneOf:
      - type: boolean
      - type: string
    PrefSetting:
      type: object
      properties:
        value:
          oneOf:
          - type: boolean
          - type: object
            properties:
              x:
                type: string
            required:
            - x
      required:
      - value
    Tag:
      type: object
      properties:
        name:
          type: string
      required:
      - name
