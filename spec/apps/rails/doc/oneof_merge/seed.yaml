---
# Hand-written document the oneOf merge spec records over. The outer spec
# copies it to openapi.yaml, runs the recording, and compares the result with
# the committed openapi.yaml.
openapi: 3.1.0
info:
  title: oneOf merge
  version: 1.0.0
servers: []
paths:
  "/oneof_merge/empty_one_of":
    get:
      summary: GET /oneof_merge/empty_one_of
      responses:
        '200':
          description: seed
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    oneOf:
                required:
                - value
  "/oneof_merge/param":
    get:
      summary: GET /oneof_merge/param
      parameters:
      - name: q
        in: query
        required: false
        schema:
          oneOf:
          - type: integer
          - type: string
          - type: 'null'
      responses:
        '200':
          description: seed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                - ok
  "/oneof_merge/annotated":
    get:
      summary: GET /oneof_merge/annotated
      responses:
        '200':
          description: seed
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: string
                    description: The display name
                    deprecated: true
                required:
                - value
  "/oneof_merge/typeless":
    get:
      summary: GET /oneof_merge/typeless
      responses:
        '200':
          description: seed
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      type: 'null'
                      description: Set once the user picks one
                required:
                - values
  "/oneof_merge/typeless_enum":
    get:
      summary: GET /oneof_merge/typeless_enum
      responses:
        '200':
          description: seed
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      type: 'null'
                      enum:
                      - 1
                      - x
                required:
                - values
