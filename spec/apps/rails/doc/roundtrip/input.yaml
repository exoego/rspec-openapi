---
openapi: 3.2.0
info:
  title: Round-trip
  version: 1.0.0
servers: []
paths:
  # A non-object path item: the converters must skip it without raising.
  "/weird_non_hash": just a string, not a path item object
  "/roundtrip":
    get:
      summary: placeholder overwritten by the recording
      responses:
        '200':
          description: old description
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  # Untouched path carrying JSON-Schema null type arrays in every shape the
  # reader normalizes: multi-type-with-null, null-only, and multi-type-no-null.
  "/legacy":
    get:
      # An anchor. The reader hands a document holding one to YAML.safe_load.
      summary: &legacy legacy endpoint kept verbatim
      responses:
        '200':
          description: legacy
          content:
            application/json:
              schema:
                type: object
                properties:
                  multi_with_null:
                    type:
                    - string
                    - integer
                    - 'null'
                  only_null:
                    type:
                    - 'null'
                  multi_no_null:
                    type:
                    - string
                    - integer
                    # `examples` under a schema is the JSON Schema keyword: a
                    # plain array, not the named map it is under a media type.
                    examples:
                    - a string
                    - 42
              # A named example under a media type, whose name is normalized
              # on reading like the ones a run records.
              examples:
                Legacy Example:
                  value:
                    multi_with_null: 1
