name: Publish to RubyGems

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish gem and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      id-token: write   # for RubyGems trusted publishing
      contents: write   # to create GitHub release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '4.0.7'

      # No bundler cache here. A poisoned cache must not reach the published gem.
      - name: bundle install
        run: bundle install --jobs 4 --retry 3

      - name: Verify tag matches version.rb
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          file_version=$(ruby -e "require_relative './lib/rspec/openapi/version'; puts RSpec::OpenAPI::VERSION")
          if [ "$version" != "$file_version" ]; then
            echo "Tag version ($version) does not match lib/rspec/openapi/version.rb ($file_version)" >&2
            exit 1
          fi

      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
