name: Publish to RubyGems

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish gem and GitHub release
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # for RubyGems trusted publishing
      contents: write   # to create GitHub release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          bundler-cache: true
          ruby-version: '4.0.7'

      - name: Verify tag matches version.rb
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          file_version=$(ruby -e "require_relative './lib/rspec/openapi/version'; puts RSpec::OpenAPI::VERSION")
          if [ "$version" != "$file_version" ]; then
            echo "Tag version ($version) does not match lib/rspec/openapi/version.rb ($file_version)" >&2
            exit 1
          fi

      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
