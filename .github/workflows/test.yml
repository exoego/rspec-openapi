name: test
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    container: ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        # Image digests are updated by Renovate. See the custom manager in renovate.json.
        include:
          - ruby: ruby:2.7@sha256:2347de892e419c7160fc21dec721d5952736909f8c3fbb7f84cb4a07aaf9ce7d
          - ruby: ruby:3.0@sha256:dcb8a8a6ee981f949da505cb9f4f15cde696e7bcb088955bc1f92f23a4cd7a72
          - ruby: ruby:3.1@sha256:91627f55e8969006aab67d15c92fb930500ff73948803da1330b8a853fecebb5
          - ruby: ruby:3.1@sha256:91627f55e8969006aab67d15c92fb930500ff73948803da1330b8a853fecebb5
            rails: 7.0.10
          - ruby: ruby:3.3@sha256:feb86cb7e42c69ae2804ed5fc0a29e7f6b4ec0eaa78bb056a03321891544aa25
            rails: 7.1.6
          - ruby: ruby:3.4@sha256:48ecc7a76bacf6fc0da5f6c7a5b43f96461bac68fa571213a8afcf79c461c7b7
            rails: 8.0.5.1
          - ruby: ruby:4.0@sha256:e7e33621dd8ac85cdfa472b9c13ac1ec03cedf9e15b79c696891cf11226980c6
            rails: 8.1.4
            coverage: coverage
    env:
      RAILS_VERSION: ${{ matrix.rails == '' && '6.1.7.10' || matrix.rails }}
      COVERAGE: ${{ matrix.coverage || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bundle install
        run: bundle install --jobs "$(nproc)" --retry 3
      - run: bundle exec scripts/parallel_rspec
        timeout-minutes: 2
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        name: codecov-action@v4 workaround
      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ matrix.coverage == 'coverage' }}
        with:
          fail_ci_if_error: true
          files: ./coverage/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # The repository ruleset requires a check named test-gate. Keep the job name.
  test-gate:
    name: test-gate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: test
    if: ${{ always() }}
    steps:
      - env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
